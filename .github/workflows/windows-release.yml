name: Windows build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Ejecutar pruebas
        run: dotnet test cstranslate.sln --configuration Release
      - name: Definir versión
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+)') {
            $version = $Matches[1]
          } else {
            $version = '0.1.0'
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV
      - name: Publicar aplicación Windows x64
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          dotnet publish src/CsTranslate.App/CsTranslate.App.csproj
          --configuration Release --runtime win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:Version=$env:APP_VERSION
          -p:AssemblyVersion=$env:APP_VERSION.0
          -p:FileVersion=$env:APP_VERSION.0
          --output publish
      - name: Descargar modelo Whisper base
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/models | Out-Null
          Invoke-WebRequest -Uri "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.bin" -OutFile "publish/models/ggml-base.bin"
      - name: Instalar Inno Setup
        if: startsWith(github.ref, 'refs/tags/v')
        run: choco install innosetup --yes --no-progress
      - name: Crear instalador
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$env:APP_VERSION" "installer/EchoLingo-ES.iss"
      - name: Publicar instalador como Release preliminar
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME "artifacts/EchoLingo-ES-Setup.exe" --repo $env:GITHUB_REPOSITORY --title "EchoLingo ES $env:APP_VERSION" --generate-notes --prerelease
      - name: Guardar instalador como artefacto de prueba
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: EchoLingo-ES-Setup
          path: artifacts/EchoLingo-ES-Setup.exe
